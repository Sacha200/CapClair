name: CI

on:
  pull_request:
  push:
    branches: [main]

defaults:
  run:
    working-directory: 07-developpement

jobs:
  contract:
    name: contract (build + typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: 07-developpement/package-lock.json
      - run: npm ci
      - run: npm run build --workspace @capclair/contract
      - run: npm run typecheck --workspace @capclair/contract

  back:
    name: back (typecheck + lint + tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: capclair
          POSTGRES_PASSWORD: capclair_dev
          POSTGRES_DB: capclair
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U capclair" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://capclair:capclair_dev@localhost:5434/capclair?schema=public
      TEST_DATABASE_URL: postgresql://capclair:capclair_dev@localhost:5434/capclair_test?schema=public
      REDIS_URL: redis://localhost:6379
      APP_BASE_URL: http://localhost:3000
      COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: 07-developpement/package-lock.json
      - run: npm ci
      - run: npm run build --workspace @capclair/contract
      - run: npm run prisma:generate --workspace capclair-back
      - name: Créer la base de test
        run: psql "$DATABASE_URL" -c 'CREATE DATABASE capclair_test;'
      - run: npm run prisma:deploy --workspace capclair-back
      - run: npm run typecheck --workspace capclair-back
      - run: npm run lint --workspace capclair-back
      - run: npm run test --workspace capclair-back
      - run: npm run test:int --workspace capclair-back

  front:
    name: front (typecheck + lint + build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: 07-developpement/package-lock.json
      - run: npm ci
      - run: npm run build --workspace @capclair/contract
      - run: npm run typecheck --workspace front
      - run: npm run lint --workspace front
      - run: npm run build --workspace front
      - run: npm run test --workspace front

  secret-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
